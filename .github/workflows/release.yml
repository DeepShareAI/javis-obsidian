# Builds, tests and publishes a release with a build-provenance attestation
# for main.js (Obsidian review recommendation, 2026-10-28). Runs on a pushed
# version tag (x.y.z, no "v", equal to manifest.json's version), or by hand for
# an existing tag to rebuild and re-sign its assets.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. 0.3.3)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Tag equals manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match manifest.json version $version"
            exit 1
          fi

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Create the release if missing, then upload the assets
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" main.js manifest.json --clobber
